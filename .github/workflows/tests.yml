name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify reviewed governance sources
        run: python3 -B scripts/test_governance_sources.py
      - name: Parse inert autonomy metadata (Python 3.11+)
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib
          contract = tomllib.loads(pathlib.Path("automation/project.toml").read_text(encoding="utf-8"))
          assert contract["schema_version"] == 1
          assert contract["repository"] == "AlexandrShapkin/relayforge"
          assert contract["execution"]["enabled"] is False
          assert contract["execution"]["auto_merge"] is False
          assert contract["execution"]["auto_deploy"] is False
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check shared developer interface syntax and offline status
        run: |
          python3 -B -m py_compile scripts/development_interface.py
          python3 -B scripts/development_interface.py relayforge status
