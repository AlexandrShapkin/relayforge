name: RDC-independent development verification

# All commands execute on a disposable GitHub-hosted runner.
# No ThinkPad, VPS, RouterOS or Android connection is required.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rdc-independent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-offline:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/ci
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install pinned just for recipe regression tests
        run: |
          cargo install just --version 1.40.0 --locked --root "$RUNNER_TEMP/just" --target-dir "$RUNNER_TEMP/just-build"
          echo "$RUNNER_TEMP/just/bin" >> "$GITHUB_PATH"
      - name: Validate recovery bootstrap syntax
        run: bash -n deploy/relayforge-hot-activate.sh
      - name: Verify independent recovery guard without hardware
        run: |
          bash -n deploy/install-local-recovery.sh
          python3 -m py_compile deploy/relayforge-local-recover.py scripts/test_local_recovery.py
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build Linux release binaries
        run: cargo build --release --locked -p relayforge-agent -p relayforge-mcp
      - name: Confirm restricted MCP operation without devices
        run: python3 scripts/offline_mcp_smoke.py .build/ci/release/relayforge-mcp
      - name: Verify owner-approved artifact reads in a disposable home
        run: python3 -B scripts/offline_artifact_acceptance.py .build/ci/release/relayforge-mcp
      - name: Package CI-only binaries
        run: |
          python3 - <<'PYMETA'
          import hashlib, json, pathlib, subprocess
          binary = pathlib.Path(".build/ci/release/relayforge-mcp")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          record = {"schema_version": 1, "commit": commit,
                    "sha256": hashlib.sha256(binary.read_bytes()).hexdigest(), "binary": "relayforge-mcp"}
          binary.with_name("manifest.json").write_text(json.dumps(record) + "\n")
          PYMETA
          tar -C .build/ci/release -czf /tmp/relayforge-ci-linux-x86_64.tar.gz relayforge-agent relayforge-mcp manifest.json
          sha256sum /tmp/relayforge-ci-linux-x86_64.tar.gz > /tmp/relayforge-ci-linux-x86_64.tar.gz.sha256
      - name: Retain disposable build for manual inspection only
        uses: actions/upload-artifact@v4
        with:
          name: relayforge-ci-linux-x86_64
          path: |
            /tmp/relayforge-ci-linux-x86_64.tar.gz
            /tmp/relayforge-ci-linux-x86_64.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  arch-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Official base-20260924.0.599135, verified against registry manifest.
      image: archlinux/archlinux@sha256:676f4d5b2cacc259ab30b1e871a272bd4a2e023a901f725fb1b12c84dc355f10
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/ci-arch
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Install snapshot toolchain in disposable container
        run: |
          echo 'Server = https://archive.archlinux.org/repos/2026/09/25/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm --needed base-devel rust python git
          useradd --create-home builder
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build and verify as unprivileged user
        shell: bash
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env CARGO_TARGET_DIR="$CARGO_TARGET_DIR" SOURCE_SHA="$SOURCE_SHA" bash ci/arch-source.sh
      - name: Retain exact-source binaries and operational source package
        uses: actions/upload-artifact@v4
        with:
          name: relayforge-arch-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: .build/arch-dist/*
          retention-days: 7
          if-no-files-found: error

  attest-arch:
    needs: arch-source
    # PRs (including forks) receive no write/OIDC permissions. Public trusted
    # main dispatch supports GitHub attestations; unsupported repositories skip.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: relayforge-arch-source-${{ github.sha }}
          path: dist
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/*.tar.gz'

  sandbox-integration:
    # Noble's restricted userns policy denies bwrap's loopback RTM_NEWADDR.
    # Do not relax AppArmor or networking. Build the exact source on Jammy
    # for its libc; full workspace checks above retain the current Ubuntu.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/ci-sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install disposable-runner sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Build exact-head sandbox worker for this runner
        run: cargo build --release --locked -p relayforge-mcp
      - name: Exercise real sandbox development fixture without grants or devices
        run: python3 -B scripts/offline_development_workflow.py .build/ci-sandbox/release/relayforge-mcp
      - name: Exercise expiring task authorization and editable sandbox workspace
        run: python3 -B scripts/offline_authorized_development.py .build/ci-sandbox/release/relayforge-mcp
      - name: Exercise hardened HTTP and stdio and scheduled rollback
        # System manager on this disposable hosted runner supports namespace
        # hardening that the hosted user manager rejects (EXIT_NAMESPACE 226).
        # The fixture still executes as the unprivileged runner UID.
        timeout-minutes: 9
        env:
          RELAYFORGE_CI_SYSTEMD_SYSTEM: "1"
        run: python3 -B scripts/test_tunnel_artifact_isolation.py .build/ci-sandbox/release/relayforge-mcp
