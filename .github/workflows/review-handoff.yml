name: Independent review handoff
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
concurrency:
  group: review-handoff-repository
  cancel-in-progress: false
jobs:
  handoff:
    if: github.repository == 'AlexandrShapkin/relayforge' && (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-24.04
    steps:
      # Only trusted base/default source. Never fetch or execute the PR head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ci/review_handoff.py
