name: Bug report
description: Report a reproducible non-sensitive issue
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Do not disclose vulnerabilities or private infrastructure data here. See SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Sanitized reproduction steps
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
