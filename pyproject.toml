[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relayforge"
version = "0.1.0"
description = "Self-hosted, policy-governed remote device management over MCP"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.setuptools.packages.find]
where = ["src"]
