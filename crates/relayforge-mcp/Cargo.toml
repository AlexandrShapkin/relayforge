[package]
name = "relayforge-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
relayforge-protocol = { path = "../relayforge-protocol" }
relayforge-policy = { path = "../relayforge-policy" }
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
subtle = "2.6"
serde = { version = "1", features = ["derive"] }
# Last release supporting the workspace's Rust 1.85 contract; RS256 only.
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
